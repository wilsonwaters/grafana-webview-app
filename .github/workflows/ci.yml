name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    # The QA-Alintech environment provides the GRAFANA_INSTANCE_URL variable used
    # as a private-signing root URL. The access policy token is a repository
    # secret; only the two signing steps below receive it (RV1-16), so npm
    # scripts, tests, linters and build tools in the other steps cannot read it.
    environment: QA-Alintech
    outputs:
      plugin-id: ${{ steps.metadata.outputs.plugin-id }}
      plugin-version: ${{ steps.metadata.outputs.plugin-version }}
      has-e2e: ${{ steps.check-for-e2e.outputs.has-e2e }}
      has-backend: ${{ steps.check-for-backend.outputs.has-backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Build frontend
        run: npm run build

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: ./...

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: test

      - name: Check for E2E
        id: check-for-e2e
        run: |
          if [ -f "playwright.config.ts" ]
          then
            echo "has-e2e=true" >> "$GITHUB_OUTPUT"
          fi

      # Private signing. The plugin is not in the Grafana catalog, so a public/
      # community signature would be rejected (HTTP 409). We sign privately for the
      # deployment host plus http://localhost:3000 so the signed build also loads in
      # the CI e2e Grafana and in local testing. The rootUrls live in the package.json
      # `sign` script (single source of truth, shared with the release workflow) --
      # do not pass a `-- --rootUrls` override here or sign-plugin receives the flag
      # twice.
      # A secret cannot be tested in `if:` directly, so this step tests it in the
      # shell and exposes only whether it is set (forks and Dependabot runs have
      # no token and skip signing).
      - name: Check for signing token
        id: check-signing-token
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [ -n "${GRAFANA_ACCESS_POLICY_TOKEN}" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign plugin (private)
        if: steps.check-signing-token.outputs.has-token == 'true'
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: npm run sign

      - name: Get plugin metadata
        id: metadata
        run: |
          sudo apt-get install jq

          GRAFANA_PLUGIN_ID="$(jq -r .id dist/plugin.json)"
          GRAFANA_PLUGIN_VERSION="$(jq -r .info.version dist/plugin.json)"
          GRAFANA_PLUGIN_ARTIFACT="${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip"

          {
            echo "plugin-id=${GRAFANA_PLUGIN_ID}"
            echo "plugin-version=${GRAFANA_PLUGIN_VERSION}"
            echo "archive=${GRAFANA_PLUGIN_ARTIFACT}"
          } >> "$GITHUB_OUTPUT"

      - name: Package plugin
        id: package-plugin
        run: |
          mv dist "${PLUGIN_ID}"
          zip "${ARCHIVE}" "${PLUGIN_ID}" -r
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}

      - name: Check plugin.json
        run: |
          docker run --pull=always \
            -v "${PWD}/${ARCHIVE}:/archive.zip" \
            grafana/plugin-validator-cli -analyzer=metadatavalid /archive.zip
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}

      # AC 32 (PR-time early check): run the FULL @grafana/plugin-validator against
      # the packaged plugin so contributors see all validator findings on every PR,
      # not only plugin.json schema validity (which the hard `Check plugin.json`
      # step above already gates). This step is ADVISORY (continue-on-error): the
      # hard, fail-closed validator GATE lives in release.yml and runs on the
      # signed release package. Keeping the PR check advisory surfaces issues
      # early without blocking PRs on deferred docs-stream content (screenshots,
      # catalog logos, README links). Review this step's log on every PR.
      - name: Validate plugin (full, advisory)
        continue-on-error: true
        run: |
          docker run --pull=always \
            -v "${PWD}/${ARCHIVE}:/archive.zip" \
            grafana/plugin-validator-cli /archive.zip
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}

      - name: Archive Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.plugin-id }}-${{ steps.metadata.outputs.plugin-version }}
          path: ${{ steps.metadata.outputs.plugin-id }}
          retention-days: 5

  # AC 36: "All security tests pass in CI on every PR (security suite cannot be
  # skipped)." This job is intentionally SEPARATE from `build` and is NOT gated
  # by any `has-backend` conditional, so the backend security suite (AC 17-31,
  # VR and RV2 fixes) always runs on every push to main and every PR. The guard
  # script asserts a `--- PASS:` line for every required test (REQUIRED_TESTS
  # in scripts/security-suite.sh), so removing, renaming, or
  # `t.Skip`-ping a security test fails this job rather than silently passing.
  #
  # NOTE: To prevent merging while this job is red or missing, add `Security
  # suite (non-skippable)` to the repository's required status checks. That is a
  # branch-protection setting (admin action), separate from this workflow.
  security-suite:
    name: Security suite (non-skippable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run mandatory security suite
        run: ./scripts/security-suite.sh

  # AC 32 / decisions Q13b and D3: the E2E Grafana-version matrix is AUTO-RESOLVED
  # by the official `grafana/plugin-actions/e2e-version` action rather than pinned
  # by hand. From this plugin's `dependencies.grafanaDependency` (>=12.4.0) the
  # action derives the matrix: the latest patch of every supported Grafana minor
  # from the minimum (12.4.x, 13.0.x, 13.1.x, 13.2.x, ...) up to current, plus
  # `grafana-enterprise:nightly` (capped at 6 versions by the action's default
  # limit). This covers both React runtimes: 12.4-13.1 run React 18 and 13.2+
  # runs React 19. Keep this auto-resolved set as-is (do not pin a narrower list,
  # do not expand to the full minor range), so the matrix always tracks the
  # supported range and newly released minors without a workflow edit.
  # `playwright-tests` below fans out over it.
  resolve-versions:
    name: Resolve e2e images
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: build
    if: ${{ needs.build.outputs.has-e2e == 'true' }}
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Grafana E2E versions
        id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@b2d42498af86999c092e974be98860757fd3cb10 # e2e-version/v3.2.0

  playwright-tests:
    needs: [resolve-versions, build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{fromJson(needs.resolve-versions.outputs.matrix)}}
    name: e2e test ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: ${{ needs.build.outputs.plugin-id }}-${{ needs.build.outputs.plugin-version }}

      - name: Execute permissions on binary
        if: needs.build.outputs.has-backend == 'true'
        run: |
          chmod +x ./dist/gpx_*

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dev dependencies
        run: npm ci

      # The matrix values reach the shell through env, not ${{ }} expansion in
      # the script, so they cannot inject shell syntax.
      - name: Start Grafana
        env:
          GRAFANA_VERSION: ${{ matrix.GRAFANA_IMAGE.VERSION }}
          GRAFANA_IMAGE: ${{ matrix.GRAFANA_IMAGE.NAME }}
          ANONYMOUS_AUTH_ENABLED: 'false'
          DEVELOPMENT: 'false'
        run: |
          docker compose pull
          docker compose up -d

      - name: Wait for grafana server
        uses: grafana/plugin-actions/wait-for-grafana@4205a0824a13b71fdb9b9b49f28f5f72b754f81f # wait-for-grafana/v1.0.5
        with:
          url: http://localhost:3000/login

      - name: Install Playwright Browsers
        run: npm exec playwright install chromium --with-deps

      - name: Run Playwright tests
        id: run-tests
        run: npm run e2e

      - name: Docker logs
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        run: |
          docker logs wilsonwaters-webview-app >& grafana-server.log

      - name: Stop grafana docker
        run: docker compose down

      # Uncomment this step to upload the server log to Github artifacts. Remember Github artifacts are public on the Internet if the repository is public.
      # - name: Upload server log
      #   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      #   if: ${{ always() && steps.run-tests.outcome == 'failure' }}
      #   with:
      #     name: ${{ matrix.GRAFANA_IMAGE.NAME }}-v${{ matrix.GRAFANA_IMAGE.VERSION }}-${{github.run_id}}-server-log
      #     path: grafana-server.log
      #     retention-days: 5

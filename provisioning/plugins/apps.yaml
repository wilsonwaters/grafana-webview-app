# ---------------------------------------------------------------------------
# DEV/CI ONLY — production installs start with an empty allowlist.
# ---------------------------------------------------------------------------
# This file provisions the Web View app for the local development container
# (docker compose mounts ./provisioning) and for the CI end-to-end tests.
# Do not copy it to a production Grafana. On a new install the allowlist is
# empty, so the proxy denies every request until an administrator adds domains
# on the app's Configuration page.
#
# Grafana applies this file at every start. It replaces the jsonData that was
# saved on the Configuration page, so local changes do not survive a restart.
#
# The e2e suite needs example.com in the allowlist (the TC4 "Test URL" success
# path and the panel specs). The denied-path spec uses a host that is NOT in
# this list. This plugin stores no secrets: do not add secureJsonData here.
apiVersion: 1

apps:
  - type: 'wilsonwaters-webview-app'
    org_id: 1
    org_name: 'wilsonwaters'
    disabled: false
    jsonData:
      allowedDomains:
        - domain: example.com
          options:
            allowSubdomains: false
